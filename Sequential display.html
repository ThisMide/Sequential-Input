      .input-container {
        display: grid;

        max-width: 400px;
      }

      input {
        padding: 5px;

        padding: 10px 20px;

        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>

    <h1>Sequential Input Update</h1>
    <div id="input-container" class="input-container">
      <!-- Input fields will be dynamically generated -->
    </div>
    <button id="start-button">Start</button>

    <script>
      // Reference to the input container
      const inputContainer = document.getElementById("input-container");

      // Create 10 input fields dynamically
      for (let i = 0; i < 10; i++) {
        const inputField = document.createElement("input");
        inputField.type = "text";
        inputField.readOnly = true; // Prevent manual edits
        inputContainer.appendChild(inputField);
      }

      // Reference to the button
      const startButton = document.getElementById("start-button");

      // Add click event listener to the button
      startButton.addEventListener("click", () => {
        const inputs = document.querySelectorAll("#input-container input");
        let delay = 0;

        // Loop through each input and update it after a delay
        inputs.forEach((input, index) => {
          setTimeout(() => {
            input.value = "--->";
            input.style.fontWeight = "bold";
          }, delay);

          // Increase delay for the next input
          delay += 1000; // 1 second interval
        });
      });
    </script>
  </body>
