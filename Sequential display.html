<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sequential Input Update</title>
    <!-- <link rel="stylesheet" href="Sequencial Display.css" /> -->
    <style>
      body {
          font-family: Arial, sans-serif;
          text-align: center;
          margin: 20px;
      }

      .input-container {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin: 0 auto;
          max-width: 400px;
          background-color: #eee;
          padding: 15px;
          border-radius: 5px;
      }

      input {
          width: 100px;
          padding: 5px;
          text-align: center;
          background-color: #f9f9f9;
          border: 1px solid #ccc;
          border-radius: 3px;
          font-size: 14px;
      }

      button {
          padding: 10px 20px;
          font-size: 16px;
          background-color: #4CAF50;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
      }

      button:hover {
          background-color: #45a049;
      }

      .gradient-blue {
          color: blue;
      }

      .gradient-green {
          color: green;
      }

      .gradient-lemon {
          color: #d4d700; /* Lemon-like color */
      }

      .gradient-orange {
          color: orange;
      }

      .gradient-red {
          color: red;
      }
  </style>
</head>
<body>
  <h1>Sequential Input Update</h1>
  <div id="input-container" class="input-container">
      <!-- Input fields will be dynamically generated -->
  </div>
  <button id="start-button">Start</button>

  <script>
      // Reference to the input container
      const inputContainer = document.getElementById('input-container');

      // Class names for gradients
      const gradientClasses = ['gradient-blue', 'gradient-green', 'gradient-lemon', 'gradient-orange', 'gradient-red'];

      // Create 10 input fields dynamically
      for (let i = 0; i < 10; i++) {
          const inputField = document.createElement('input');
          inputField.type = 'text';
          inputField.readOnly = true; // Prevent manual edits
          inputField.classList.add(gradientClasses[i % gradientClasses.length]);
          inputContainer.appendChild(inputField);
      }

      // Reference to the button
      const startButton = document.getElementById('start-button');

      // Add click event listener to the button
      startButton.addEventListener('click', () => {
          const inputs = document.querySelectorAll('#input-container input');
          let delay = 0;

          // Loop through each input and update it after a delay
          inputs.forEach((input, index) => {
              setTimeout(() => {
                  input.value = '--->';
                  input.style.fontWeight = 'bold';

                  // Clear the input after 1 second
                  setTimeout(() => {
                      input.value = '';
                      input.style.fontWeight = 'normal';
                  }, 1000);
              }, delay);

              // Increase delay for the next input
              delay += 1000; // 1 second interval
          });
      });
  </script>
</body>
</html>
